<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8" /><title>Micro-service — Horodateur</title></head>
<body>
<script>
  /**
   * Micro-service "horodateur" : retourne la date/heure courante formatée.
   */
  function traiter(payload) {
    const format = (payload && payload.format) || "long";
    const maintenant = new Date();

    const dateFormatee = format === "court"
      ? maintenant.toLocaleDateString("fr-FR")
      : maintenant.toLocaleDateString("fr-FR", { weekday: "long", year: "numeric", month: "long", day: "numeric" })
        + " à " + maintenant.toLocaleTimeString("fr-FR");

    return { succes: true, date_formatee: dateFormatee, timestamp: maintenant.getTime() };
  }

  // ---- Infrastructure commune (identique au modèle) ----
  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.type !== "MS_REQUEST") return;
    let result;
    try { result = traiter(data.payload); }
    catch (err) { result = { succes: false, erreur: err.message }; }
    event.source.postMessage(
      { type: "MS_RESPONSE", requestId: data.requestId, result },
      event.origin === "null" ? "*" : event.origin
    );
  });
</script>
</body>
</html>
