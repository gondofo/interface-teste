<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Micro-service — Modèle</title>
</head>
<body>
<!--
  ==========================================================================
  MODÈLE DE MICRO-SERVICE STATIQUE AUTONOME
  ==========================================================================
  Ce fichier est le patron à copier pour créer n'importe quel nouveau
  micro-service ("neurone") du système.

  Contraintes respectées :
   - Page statique, sans framework, sans serveur.
   - Aucune interface graphique destinée à un humain (le <body> reste vide
     ou minimal ; ce n'est pas un besoin d'UX ici).
   - Traitement pur : reçoit une charge utile, exécute UNE tâche unitaire,
     renvoie un résultat JSON.
   - Communication via postMessage, ce qui permet un déploiement sur
     n'importe quel hébergeur statique (GitHub Pages, Netlify, S3…) même
     sur un domaine différent de l'Interface Mère (pas de souci CORS).

  Pour créer un nouveau service :
   1. Copier ce fichier.
   2. Remplacer le contenu de `traiter(payload)` par la logique métier.
   3. Déclarer le service dans registry.json (url, mots_cles, paramètres).
  ==========================================================================
-->
<script>
  /**
   * Fonction de traitement métier du micro-service.
   * Reçoit le payload construit par le Router et retourne un objet
   * sérialisable en JSON, contenant au minimum { succes: boolean }.
   *
   * >>> C'est la SEULE fonction à réécrire pour créer un nouveau service. <<<
   */
  function traiter(payload) {
    // -- Exemple neutre : renvoie simplement la charge reçue --
    return {
      succes: true,
      echo: payload,
      note: "Remplacez cette fonction par la logique réelle du micro-service.",
    };
  }

  // ------------------------------------------------------------------------
  // Infrastructure commune à TOUS les micro-services (ne pas modifier)
  // ------------------------------------------------------------------------
  window.addEventListener("message", (event) => {
    const data = event.data;

    // Filtre : on ne traite que les requêtes du protocole du système
    if (!data || data.type !== "MS_REQUEST") return;

    // En production : valider event.origin contre une liste blanche
    // d'origines autorisées (l'URL de l'Interface Mère), par exemple :
    // const ORIGINES_AUTORISEES = ["https://mere.exemple.com"];
    // if (!ORIGINES_AUTORISEES.includes(event.origin)) return;

    let result;
    try {
      result = traiter(data.payload);
    } catch (err) {
      result = { succes: false, erreur: `Erreur interne du micro-service : ${err.message}` };
    }

    // Renvoi de la réponse au demandeur (l'Interface Mère), avec le même
    // requestId afin qu'elle puisse associer la réponse à sa requête.
    event.source.postMessage(
      { type: "MS_RESPONSE", requestId: data.requestId, result },
      event.origin === "null" ? "*" : event.origin
    );
  });
</script>
</body>
</html>
