<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mère — Interface d'orchestration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:          #08090c;
    --panel:       #14181f;
    --panel-2:     #1a1f28;
    --bulle-systeme: #14181f;
    --bulle-user:    #7c9cff;
    --line:        #212632;
    --text:        #e7e9ee;
    --text-user:     #08090c;
    --muted:       #6b7280;
    --accent:      #7c9cff;
    --accent-dim:    #35406e;
    --ok:          #34d399;
    --err:         #f87171;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --largeur-max: 720px;
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- En-tête ---------- */
  header{
    flex:0 0 auto;
    width:100%;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    z-index:5;
  }
  .entete-interieur{
    width:100%;
    max-width:var(--largeur-max);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-family:var(--mono);
    font-weight:600;
    font-size:14px;
    letter-spacing:0.12em;
    color:var(--text);
  }
  .logo span{ color:var(--accent); }
  .statut-registre{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .point{
    width:7px; height:7px; border-radius:50%;
    background:var(--muted);
    transition:background .3s;
    flex:0 0 auto;
  }
  .point.ok{ background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .point.err{ background:var(--err); box-shadow:0 0 8px var(--err); }

  /* ---------- Fil de discussion ---------- */
  #fil{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    justify-content:center;
    scroll-behavior:smooth;
  }
  .fil-interieur{
    width:100%;
    max-width:var(--largeur-max);
    padding:28px 20px 24px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .accueil{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:40px 20px;
    line-height:1.7;
  }
  .accueil strong{ color:var(--text); font-weight:600; }

  /* ---------- Bulles de message ---------- */
  .message{
    display:flex;
    flex-direction:column;
    max-width:85%;
    animation:apparition .22s ease;
  }
  @keyframes apparition{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .message.utilisateur{ align-self:flex-end; align-items:flex-end; }
  .message.systeme{ align-self:flex-start; align-items:flex-start; }

  .bulle{
    padding:14px 18px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.6;
    word-break:break-word;
  }
  .message.utilisateur .bulle{
    background:var(--bulle-user);
    color:var(--text-user);
    border-bottom-right-radius:4px;
    white-space:pre-wrap;
  }
  .message.systeme .bulle{
    background:var(--bulle-systeme);
    border:1px solid var(--line);
    color:var(--text);
    border-bottom-left-radius:4px;
  }
  .message.systeme .bulle.attente{
    color:var(--muted);
    font-style:italic;
  }

  /* Mise en forme conversationnelle propre pour les réponses système */
  .bulle p { margin: 0 0 10px 0; }
  .bulle p:last-child { margin-bottom: 0; }
  .bulle ul { margin: 8px 0 12px 20px; padding: 0; }
  .bulle li { margin-bottom: 6px; }

  /* Sources discrètes en bas de bulle */
  .sources-conteneur {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--muted);
  }
  .sources-titre {
    font-weight: 500;
    margin-bottom: 4px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .sources-liste {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .sources-liste li a {
    color: var(--accent);
    text-decoration: none;
    background: var(--panel-2);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-liste li a:hover {
    background: var(--line);
    border-color: var(--accent-dim);
  }

  /* Points de suspension "en train d'écrire" */
  .points-attente{ display:inline-flex; gap:3px; }
  .points-attente span{
    width:5px; height:5px; border-radius:50%;
    background:var(--muted);
    animation:clignote 1.1s infinite ease-in-out;
  }
  .points-attente span:nth-child(2){ animation-delay:.15s; }
  .points-attente span:nth-child(3){ animation-delay:.3s; }
  @keyframes clignote{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }

  /* ---------- Barre de saisie fixe ---------- */
  #barre-saisie{
    flex:0 0 auto;
    width:100%;
    display:flex;
    justify-content:center;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    border-top:1px solid var(--line);
  }
  #formPrompt{
    width:100%;
    max-width:var(--largeur-max);
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;
    padding:6px 6px 6px 8px;
    transition:border-color .2s;
  }
  #formPrompt:focus-within{ border-color:var(--accent-dim); }

  .bouton-plus{
    flex:0 0 auto;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-size:19px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .bouton-plus:hover{ color:var(--accent); border-color:var(--accent-dim); background:var(--panel-2); }
  .bouton-plus:active{ transform:scale(.94); }

  textarea#champPrompt{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    min-height:22px;
    max-height:140px;
    padding:8px 4px;
  }
  textarea#champPrompt::placeholder{ color:var(--muted); }

  button.envoyer{
    flex:0 0 auto;
    background:var(--accent);
    color:#08090c;
    border:none;
    border-radius:18px;
    padding:9px 18px;
    font-family:var(--sans);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  button.envoyer:hover{ opacity:.88; }
  button.envoyer:active{ transform:scale(.96); }
  button.envoyer:disabled{ opacity:.35; cursor:not-allowed; }

  #fil::-webkit-scrollbar{ width:6px; }
  #fil::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
</style>
</head>
<body>

  <header>
    <div class="entete-interieur">
      <div class="logo">MÈRE<span>::</span>ORCHESTRATEUR</div>
      <div class="statut-registre">
        <div class="point" id="pointRegistre"></div>
        <span id="texteRegistre">registre non chargé</span>
      </div>
    </div>
  </header>

  <!-- Conteneur de discussion central -->
  <div id="fil">
    <div class="fil-interieur" id="filInterieur">
      <div class="accueil" id="accueil">
        Écrivez une tâche pour l'<strong>Interface Mère</strong> — elle sera automatiquement
        routée vers le micro-service compétent.<br>
        Exemples : « calcule 12 * (4+2) », « résume ce texte… », « traduis bonjour en anglais ».
      </div>
    </div>
  </div>

  <!-- Barre de saisie fixe -->
  <div id="barre-saisie">
    <form id="formPrompt">
      <button type="button" class="bouton-plus" id="boutonPlus" title="Ajouter un fichier ou une image (à venir)">+</button>
      <textarea id="champPrompt" rows="1" placeholder="Écrire un message…" autofocus></textarea>
      <button type="submit" class="envoyer" id="btnEnvoyer">Envoyer</button>
    </form>
  </div>

  <script src="./router.js"></script>
  <script>
    const filEl        = document.getElementById('fil');
    const filInt       = document.getElementById('filInterieur');
    const accueilEl    = document.getElementById('accueil');
    const form         = document.getElementById('formPrompt');
    const champ        = document.getElementById('champPrompt');
    const btn          = document.getElementById('btnEnvoyer');
    const boutonPlus   = document.getElementById('boutonPlus');
    const pointReg     = document.getElementById('pointRegistre');
    const texteReg     = document.getElementById('texteRegistre');

    champ.addEventListener('input', () => {
      champ.style.height = 'auto';
      champ.style.height = Math.min(champ.scrollHeight, 140) + 'px';
    });

    champ.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    boutonPlus.addEventListener('click', () => {
      console.info('Ajout de fichier/photo : fonctionnalité à venir.');
    });

    function defilerVersLeBas() {
      filEl.scrollTop = filEl.scrollHeight;
    }

    function ajouterMessage(role, contenuHtml, options = {}) {
      if (accueilEl) accueilEl.remove();

      const messageEl = document.createElement('div');
      messageEl.className = `message ${role}`;

      const bulleEl = document.createElement('div');
      bulleEl.className = 'bulle' + (options.etat ? ` ${options.etat}` : '');
      bulleEl.innerHTML = contenuHtml;

      messageEl.appendChild(bulleEl);
      filInt.appendChild(messageEl);
      defilerVersLeBas();
      return messageEl;
    }

    function mettreAJourMessage(messageEl, contenuHtml, options = {}) {
      const bulleEl = messageEl.querySelector('.bulle');
      if (options.etat) {
        bulleEl.className = `bulle ${options.etat}`;
      } else {
        bulleEl.className = 'bulle';
      }
      bulleEl.innerHTML = contenuHtml;
      defilerVersLeBas();
    }

    const router = new Router({
      registryUrl: './registry.json',
      onLog(entree) {
        console.debug('[router]', entree.evenement, entree.details);
      }
    });

    router.chargerRegistre()
      .then(() => {
        pointReg.classList.add('ok');
        texteReg.textContent = `${router.registry.services.length} micro-service(s) prêts`;
      })
      .catch(() => {
        pointReg.classList.add('err');
        texteReg.textContent = 'échec du chargement du registre';
      });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = champ.value.trim();
      if (!prompt) return;

      ajouterMessage('utilisateur', echapperHTML(prompt));
      champ.value = '';
      champ.style.height = 'auto';
      btn.disabled = true;

      const messageAttente = ajouterMessage(
        'systeme',
        '<span class="points-attente"><span></span><span></span><span></span></span>',
        { etat: 'attente' }
      );

      try {
        const resultat = await router.router(prompt);
        const formatage = formaterReponseAssistant(resultat);
        mettreAJourMessage(messageAttente, formatage.html);
      } catch (err) {
        mettreAJourMessage(messageAttente, `<p>Une erreur est survenue lors du traitement de votre demande.</p>`);
      } finally {
        btn.disabled = false;
        champ.focus();
      }
    });

    /** Formate proprement la réponse de l'assistant avec paragraphes aérés et sources discrètes en bas */
    function formaterReponseAssistant(resultat) {
      if (!resultat || resultat.succes === false) {
        return { html: `<p>Je n'ai pas pu aboutir à une réponse satisfaisante pour cette requête.</p>` };
      }

      // Extraction du texte principal (priorité aux clés de synthèse ou résultats textuels)
      let textePrincipal = '';
      if (resultat.texteRedige) {
        textePrincipal = resultat.texteRedige;
      } else if (resultat.reponse) {
        // Nettoyage si du HTML brut était passé
        textePrincipal = resultat.reponse.replace(/<\/?[^>]+(>|$)/g, "");
      } else {
        const cles = Object.keys(resultat).filter(c => !c.startsWith('_') && c !== 'succes' && c !== 'resultats');
        if (cles.length > 0) {
          const val = resultat[cles[0]];
          textePrincipal = typeof val === 'object' ? JSON.stringify(val) : String(val);
        } else {
          textePrincipal = "Opération effectuée avec succès.";
        }
      }

      // Découpage en paragraphes fluides et aérés
      const paragraphes = textePrincipal
        .split('\n')
        .map(p => p.trim())
        .filter(p => p.length > 0)
        .map(p => `<p>${echapperHTML(p)}</p>`)
        .join('');

      // Gestion propre des sources ou liens associés s'ils existent
      let sourcesHtml = '';
      const resultatsTab = resultat.resultats || resultat.sources;
      if (Array.isArray(resultatsTab) && resultatsTab.length > 0) {
        const liens = resultatsTab
          .filter(r => r.url && r.title)
          .map(r => `<li><a href="${echapperHTML(r.url)}" target="_blank" rel="noopener">${echapperHTML(r.title)}</a></li>`)
          .join('');
        
        if (liens) {
          sourcesHtml = `
            <div class="sources-conteneur">
              <div class="sources-titre">Sources associées</div>
              <ul class="sources-liste">${liens}</ul>
            </div>
          `;
        }
      }

      return { html: paragraphes + sourcesHtml };
    }

    function echapperHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    <script src="secure-storage.js"></script>
</body>
</html>
