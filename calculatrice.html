<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8" /><title>Micro-service — Calculatrice</title></head>
<body>
<script>
  /**
   * Micro-service "calculatrice" : évalue une expression arithmétique simple.
   * N'accepte que chiffres et opérateurs de base (+ - * / . parenthèses)
   * pour éviter toute exécution de code arbitraire.
   */
  function traiter(payload) {
    const expression = (payload && payload.expression || "").trim();

    if (!expression) {
      return { succes: false, erreur: "Paramètre 'expression' manquant." };
    }

    // Sécurité : on rejette tout caractère hors du sous-ensemble autorisé
    if (!/^[\d+\-*/().,\s]+$/.test(expression)) {
      return { succes: false, erreur: "Expression contient des caractères non autorisés." };
    }

    try {
      // new Function reste cantonné au sous-ensemble validé ci-dessus
      const resultat = Function(`"use strict"; return (${expression.replace(/,/g, ".")})`)();
      if (typeof resultat !== "number" || !isFinite(resultat)) {
        throw new Error("résultat non numérique");
      }
      return { succes: true, resultat, expression_evaluee: expression };
    } catch (err) {
      return { succes: false, erreur: `Expression invalide : ${err.message}` };
    }
  }

  // ---- Infrastructure commune (identique au modèle) ----
  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.type !== "MS_REQUEST") return;
    let result;
    try { result = traiter(data.payload); }
    catch (err) { result = { succes: false, erreur: err.message }; }
    event.source.postMessage(
      { type: "MS_RESPONSE", requestId: data.requestId, result },
      event.origin === "null" ? "*" : event.origin
    );
  });
</script>
</body>
</html>
