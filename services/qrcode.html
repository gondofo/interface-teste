<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — QR Code</title></head>
<body>
<!--
  Neurone "qrcode" — image générée via api.qrserver.com (gratuit, sans
  clé, retourne directement un PNG). Réutilise le mécanisme "fichier" :
  jamais de téléchargement automatique, un lien cliquable.
-->
<script>
(function () {
  "use strict";

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    const match = texte.match(/qr\s*code\s*(?:pour|de)?\s*:?\s*(.+)/i);
    const contenu = match ? match[1].trim() : texte;
    if (!contenu) return { succes: false };

    try {
      const url = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(contenu);
      const reponse = await fetch(url);
      if (!reponse.ok) throw new Error("HTTP " + reponse.status);
      const blob = await reponse.blob();
      const nomFichier = "qrcode-" + Date.now() + ".png";

      return {
        succes: true,
        texteRedige: "QR code généré pour : " + contenu,
        fichier: { blob, nom: nomFichier, type: "image/png" }
      };
    } catch (erreur) {
      console.error("[qrcode]", erreur);
      return { succes: true, texteRedige: "Je n'ai pas pu générer ce QR code (service injoignable)." };
    }
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
