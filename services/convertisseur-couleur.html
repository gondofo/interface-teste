<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — Convertisseur couleur</title></head>
<body>
<!-- Neurone "convertisseur-couleur" — HEX <-> RGB <-> HSL, conversions exactes. -->
<script>
(function () {
  "use strict";

  function hexVersRgb(hex) {
    return {
      r: parseInt(hex.slice(1, 3), 16),
      g: parseInt(hex.slice(3, 5), 16),
      b: parseInt(hex.slice(5, 7), 16)
    };
  }
  function rgbVersHex(r, g, b) {
    const h = (v) => Math.round(v).toString(16).padStart(2, "0");
    return "#" + h(r) + h(g) + h(b);
  }
  function rgbVersHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) h = s = 0;
    else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4;
      }
      h /= 6;
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
  }

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    const hexMatch = texte.match(/#?[0-9a-f]{6}\b/i);
    const rgbMatch = texte.match(/rgb\(?\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)?/i);

    let rgb;
    if (hexMatch) {
      const hex = hexMatch[0].startsWith("#") ? hexMatch[0] : "#" + hexMatch[0];
      rgb = hexVersRgb(hex);
    } else if (rgbMatch) {
      rgb = { r: parseInt(rgbMatch[1], 10), g: parseInt(rgbMatch[2], 10), b: parseInt(rgbMatch[3], 10) };
    } else {
      return { succes: true, texteRedige: "Donnez une couleur en hexadécimal (#457b9d) ou en RGB (rgb(69,123,157))." };
    }

    const hex = rgbVersHex(rgb.r, rgb.g, rgb.b);
    const hsl = rgbVersHsl(rgb.r, rgb.g, rgb.b);

    return {
      succes: true,
      texteRedige:
        "HEX : " + hex + "\n" +
        "RGB : rgb(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ")\n" +
        "HSL : hsl(" + hsl.h + ", " + hsl.s + "%, " + hsl.l + "%)"
    };
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
