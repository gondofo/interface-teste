<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — Palette de couleurs</title></head>
<body>
<!--
  Neurone "palette-couleurs" — génère des harmonies de couleurs via de
  vraies rotations de teinte HSL (théorie des couleurs), pas du hasard.
-->
<script>
(function () {
  "use strict";

  const NOMS_COULEURS = {
    "rouge": "#e63946", "bleu": "#457b9d", "vert": "#2a9d8f", "jaune": "#e9c46a",
    "orange": "#f4a261", "violet": "#7b2cbf", "rose": "#ff6b9d", "marron": "#8b5a2b",
    "gris": "#6c757d", "noir": "#121212", "blanc": "#f8f9fa", "turquoise": "#2ec4b6",
    "indigo": "#3a0ca3", "doré": "#c9a24b", "or": "#c9a24b"
  };

  function hexVersHsl(hex) {
    let r = parseInt(hex.slice(1, 3), 16) / 255;
    let g = parseInt(hex.slice(3, 5), 16) / 255;
    let b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) { h = s = 0; }
    else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4;
      }
      h /= 6;
    }
    return { h: h * 360, s: s * 100, l: l * 100 };
  }

  function hslVersHex(h, s, l) {
    h = ((h % 360) + 360) % 360;
    s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r, g, b;
    if (h < 60) [r, g, b] = [c, x, 0];
    else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c];
    else [r, g, b] = [c, 0, x];

    const versHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, "0");
    return "#" + versHex(r) + versHex(g) + versHex(b);
  }

  function extraireCouleurBase(texte) {
    const hexMatch = texte.match(/#?[0-9a-f]{6}\b/i);
    if (hexMatch) return hexMatch[0].startsWith("#") ? hexMatch[0] : "#" + hexMatch[0];
    const texteNormalise = texte.toLowerCase();
    for (const nom of Object.keys(NOMS_COULEURS)) {
      if (texteNormalise.includes(nom)) return NOMS_COULEURS[nom];
    }
    return null;
  }

  function genererHarmonie(hexBase, type) {
    const { h, s, l } = hexVersHsl(hexBase);
    switch (type) {
      case "analogue":
        return [hslVersHex(h - 30, s, l), hexBase, hslVersHex(h + 30, s, l)];
      case "triadique":
        return [hexBase, hslVersHex(h + 120, s, l), hslVersHex(h + 240, s, l)];
      case "monochromatique":
        return [hslVersHex(h, s, Math.max(15, l - 30)), hslVersHex(h, s, l), hslVersHex(h, s, Math.min(90, l + 30))];
      case "complementaire":
      default:
        return [hexBase, hslVersHex(h + 180, s, l)];
    }
  }

  const TYPES_DISPONIBLES = [
    { motif: /analogue/i, id: "analogue", nom: "analogue" },
    { motif: /triadique/i, id: "triadique", nom: "triadique" },
    { motif: /monochromatique|mono\b/i, id: "monochromatique", nom: "monochromatique" },
    { motif: /compl[ée]mentaire/i, id: "complementaire", nom: "complémentaire" }
  ];

  const MESSAGE_AUCUNE_COULEUR =
    "Je n'ai pas trouvé de couleur à partir de ce message. Donnez un code hexadécimal (#457b9d) " +
    "ou un nom courant (rouge, bleu, vert, orange, violet, rose, turquoise, doré...).";

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    if (!texte) return { succes: false };

    const couleurBase = extraireCouleurBase(texte);
    if (!couleurBase) return { succes: true, texteRedige: MESSAGE_AUCUNE_COULEUR };

    const typeTrouve = TYPES_DISPONIBLES.find((t) => t.motif.test(texte));
    const type = typeTrouve ? typeTrouve.id : "complementaire";
    const nomType = typeTrouve ? typeTrouve.nom : "complémentaire (par défaut)";

    const palette = genererHarmonie(couleurBase, type);

    return {
      succes: true,
      texteRedige:
        "Palette " + nomType + " à partir de " + couleurBase + " :\n\n" +
        palette.join("\n") +
        "\n\n(autres harmonies disponibles : analogue, triadique, monochromatique — précisez-le dans la demande)"
    };
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
