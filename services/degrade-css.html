<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — Dégradé CSS</title></head>
<body>
<!-- Neurone "degrade-css" — génère un code CSS linear-gradient à partir de 2 couleurs, ou d'une seule (harmonie complémentaire auto). -->
<script>
(function () {
  "use strict";

  const NOMS_COULEURS = {
    "rouge": "#e63946", "bleu": "#457b9d", "vert": "#2a9d8f", "jaune": "#e9c46a",
    "orange": "#f4a261", "violet": "#7b2cbf", "rose": "#ff6b9d", "turquoise": "#2ec4b6",
    "doré": "#c9a24b", "or": "#c9a24b", "noir": "#121212", "blanc": "#f8f9fa"
  };

  function hexVersHsl(hex) {
    let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) h = s = 0;
    else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) { case r: h = (g - b) / d + (g < b ? 6 : 0); break; case g: h = (b - r) / d + 2; break; default: h = (r - g) / d + 4; }
      h /= 6;
    }
    return { h: h * 360, s: s * 100, l: l * 100 };
  }
  function hslVersHex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    let r, g, b;
    if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0]; else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c]; else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
    const v = (n) => Math.round((n + m) * 255).toString(16).padStart(2, "0");
    return "#" + v(r) + v(g) + v(b);
  }

  function extraireCouleurs(texte) {
    const hexTrouves = texte.match(/#[0-9a-f]{6}/gi) || [];
    const trouvees = hexTrouves.slice();
    if (trouvees.length < 2) {
      const texteNormalise = texte.toLowerCase();
      for (const nom of Object.keys(NOMS_COULEURS)) {
        if (texteNormalise.includes(nom)) trouvees.push(NOMS_COULEURS[nom]);
      }
    }
    return trouvees;
  }

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    if (!texte) return { succes: false };

    const couleurs = extraireCouleurs(texte);
    if (couleurs.length === 0) {
      return { succes: true, texteRedige: "Donnez une ou deux couleurs (hex ou nom courant) pour générer un dégradé." };
    }

    let c1 = couleurs[0], c2 = couleurs[1];
    if (!c2) {
      const { h, s, l } = hexVersHsl(c1);
      c2 = hslVersHex(h + 180, s, l);
    }

    const angleMatch = texte.match(/(\d{1,3})\s*deg/i);
    const angle = angleMatch ? parseInt(angleMatch[1], 10) : 135;

    const css = "background: linear-gradient(" + angle + "deg, " + c1 + ", " + c2 + ");";
    return { succes: true, texteRedige: "Dégradé CSS (" + c1 + " → " + c2 + ", " + angle + "°) :\n\n" + css };
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
