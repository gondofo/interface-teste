<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — Roue pondérée</title></head>
<body>
<!--
  Neurone "roue-ponderee" — tirage aléatoire avec poids inégaux, ex:
  "pizza:3, sushi:1" -> pizza a 3x plus de chances que sushi. Aléa
  cryptographique réel (crypto.getRandomValues), pas Math.random.
-->
<script>
(function () {
  "use strict";

  function tirerAvecPoids(options) {
    const total = options.reduce((s, o) => s + o.poids, 0);
    const tirage = (crypto.getRandomValues(new Uint32Array(1))[0] / 4294967295) * total;
    let cumul = 0;
    for (const o of options) {
      cumul += o.poids;
      if (tirage <= cumul) return o.nom;
    }
    return options[options.length - 1].nom;
  }

  function extraireOptions(texte) {
    const parties = texte.split(",").map((p) => p.trim()).filter(Boolean);
    const options = [];
    for (const p of parties) {
      const m = p.match(/^(.+?):\s*(\d+(?:[.,]\d+)?)$/);
      if (m) options.push({ nom: m[1].trim(), poids: parseFloat(m[2].replace(",", ".")) });
      else if (p) options.push({ nom: p, poids: 1 }); // pas de poids précisé -> poids égal à 1
    }
    return options;
  }

  const MESSAGE_INVALIDE =
    "Format attendu : \"roue pondérée : option1:poids1, option2:poids2, ...\" — ex: \"roue pondérée : pizza:3, sushi:1, salade:1\".";

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    const match = texte.match(/roue\s+pond[ée]r[ée]e?\s*:?\s*(.+)/i) || texte.match(/tirage\s+pond[ée]r[ée]\s*:?\s*(.+)/i);
    if (!match) return { succes: false };

    const options = extraireOptions(match[1]);
    if (options.length < 2) return { succes: true, texteRedige: MESSAGE_INVALIDE };

    const gagnant = tirerAvecPoids(options);
    const total = options.reduce((s, o) => s + o.poids, 0);
    const detail = options.map((o) => o.nom + " (" + Math.round((o.poids / total) * 100) + "%)").join(", ");

    return {
      succes: true,
      texteRedige: "Résultat du tirage pondéré : " + gagnant + "\n\nProbabilités : " + detail
    };
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
