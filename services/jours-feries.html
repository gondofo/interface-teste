<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — Jours fériés français</title></head>
<body>
<!-- Neurone "jours-feries" — calcul réel de Pâques (algorithme de Gauss) puis dérivation des 11 jours fériés français. -->
<script>
(function () {
  "use strict";

  function calculerPaques(annee) {
    const a = annee % 19, b = Math.floor(annee / 100), c = annee % 100;
    const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mois = Math.floor((h + l - 7 * m + 114) / 31);
    const jour = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(annee, mois - 1, jour);
  }

  function ajouterJours(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }

  function formater(date) {
    return new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "long", year: "numeric" }).format(date);
  }

  function joursFeries(annee) {
    const paques = calculerPaques(annee);
    return [
      { nom: "Jour de l'an", date: new Date(annee, 0, 1) },
      { nom: "Lundi de Pâques", date: ajouterJours(paques, 1) },
      { nom: "Fête du travail", date: new Date(annee, 4, 1) },
      { nom: "Victoire 1945", date: new Date(annee, 4, 8) },
      { nom: "Ascension", date: ajouterJours(paques, 39) },
      { nom: "Lundi de Pentecôte", date: ajouterJours(paques, 50) },
      { nom: "Fête nationale", date: new Date(annee, 6, 14) },
      { nom: "Assomption", date: new Date(annee, 7, 15) },
      { nom: "Toussaint", date: new Date(annee, 10, 1) },
      { nom: "Armistice 1918", date: new Date(annee, 10, 11) },
      { nom: "Noël", date: new Date(annee, 11, 25) }
    ].sort((a, b) => a.date - b.date);
  }

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    const match = texte.match(/(\d{4})/);
    const annee = match ? parseInt(match[1], 10) : new Date().getFullYear();
    if (annee < 1900 || annee > 2200) return { succes: true, texteRedige: "Année hors de la plage raisonnable (1900-2200)." };

    const liste = joursFeries(annee);
    const texteRedige = "Jours fériés en France pour " + annee + " :\n\n" +
      liste.map((j) => "- " + j.nom + " : " + formater(j.date)).join("\n");

    return { succes: true, texteRedige };
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
