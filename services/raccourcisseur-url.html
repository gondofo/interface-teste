<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Source — Raccourcisseur d'URL</title></head>
<body>
<!-- Neurone "raccourcisseur-url" — is.gd (gratuit, sans clé, CORS ouvert, réponse texte simple). -->
<script>
(function () {
  "use strict";

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    const urlMatch = texte.match(/https?:\/\/\S+/i);
    if (!urlMatch) return { succes: true, texteRedige: "Donnez une URL complète à raccourcir (commençant par http:// ou https://)." };

    try {
      const url = "https://is.gd/create.php?format=simple&url=" + encodeURIComponent(urlMatch[0]);
      const reponse = await fetch(url);
      const texteReponse = (await reponse.text()).trim();
      if (!reponse.ok || texteReponse.startsWith("Error")) {
        return { succes: true, texteRedige: "Je n'ai pas pu raccourcir cette URL (" + texteReponse + ")." };
      }
      return { succes: true, texteRedige: "URL raccourcie : " + texteReponse };
    } catch (erreur) {
      console.error("[raccourcisseur-url]", erreur);
      return { succes: true, texteRedige: "Je n'ai pas pu raccourcir cette URL (service injoignable)." };
    }
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
