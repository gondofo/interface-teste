<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — Traducteur</title></head>
<body>
<!--
  Neurone "traducteur" — dictionnaire local FR/EN de démonstration.
  Traduction mot à mot sur un vocabulaire limité, pas un vrai moteur de
  traduction : les mots inconnus restent inchangés, honnêtement.
-->
<script>
(function () {
  "use strict";

  const DICO_FR_VERS_EN = {
    "bonjour": "hello", "salut": "hi", "merci": "thank you", "oui": "yes", "non": "no",
    "bonsoir": "good evening", "au revoir": "goodbye", "s'il te plaît": "please",
    "s'il vous plaît": "please", "pardon": "sorry", "excusez-moi": "excuse me",
    "chat": "cat", "chien": "dog", "maison": "house", "eau": "water", "pain": "bread",
    "ami": "friend", "amie": "friend", "travail": "work", "temps": "time",
    "aujourd'hui": "today", "demain": "tomorrow", "hier": "yesterday",
    "bien": "well", "mal": "bad", "grand": "big", "petit": "small",
    "je": "I", "tu": "you", "il": "he", "elle": "she", "nous": "we", "vous": "you", "ils": "they",
    "suis": "am", "es": "are", "est": "is", "sommes": "are", "êtes": "are", "sont": "are",
    "manger": "to eat", "boire": "to drink", "dormir": "to sleep", "parler": "to speak",
    "un": "a", "une": "a", "le": "the", "la": "the", "les": "the"
  };

  const DICO_EN_VERS_FR = Object.fromEntries(
    Object.entries(DICO_FR_VERS_EN).map(([fr, en]) => [en, fr])
  );

  function traduire(texte, cible) {
    const dico = cible === "fr" ? DICO_EN_VERS_FR : DICO_FR_VERS_EN;

    // On essaie d'abord les expressions à plusieurs mots (ex: "au revoir"),
    // puis on traduit mot à mot ce qui reste.
    let resultat = texte;
    const expressionsTriees = Object.keys(dico).sort((a, b) => b.length - a.length);

    for (const expr of expressionsTriees) {
      const motif = new RegExp("\\b" + expr.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "gi");
      resultat = resultat.replace(motif, dico[expr]);
    }
    return resultat;
  }

  async function traiterRequete(payload) {
    const texte = ((payload && payload.texte) || "").trim();
    const cible = (payload && (payload.cible === "fr" ? "fr" : "en")) || "en";
    if (!texte) return { succes: false };

    const texteTraduit = traduire(texte, cible);
    return {
      succes: true,
      texte_traduit: texteTraduit,
      langue_cible: cible,
      texteRedige: texteTraduit +
        "\n\n(traduction par dictionnaire local limité — les mots non reconnus restent inchangés)"
    };
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
