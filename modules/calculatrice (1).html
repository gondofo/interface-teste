<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — Calculatrice</title></head>
<body>
<!-- Neurone "calculatrice". Protocole MS_REQUEST/MS_RESPONSE. -->
<script>
(function () {
  "use strict";

  const MESSAGE_INVALIDE =
    "Je n'ai pas pu calculer cette expression. Vérifiez qu'elle ne contient que des chiffres " +
    "et les opérateurs + - * / ( ).";

  function calculerEnSecurite(expressionBrute) {
    // Liste blanche stricte : uniquement chiffres, opérateurs, parenthèses,
    // point/virgule décimale et espaces. Tout le reste est rejeté avant
    // toute évaluation, pour éviter d'exécuter du code arbitraire.
    const nettoyee = (expressionBrute || "").replace(/,/g, ".");
    if (!/^[\d+\-*/().\s]+$/.test(nettoyee)) return null;
    if (!/\d/.test(nettoyee)) return null;

    try {
      // eslint-disable-next-line no-new-func
      const resultat = Function('"use strict"; return (' + nettoyee + ")")();
      if (typeof resultat !== "number" || !isFinite(resultat)) return null;
      return resultat;
    } catch (erreur) {
      return null;
    }
  }

  async function traiterRequete(payload) {
    const expression = ((payload && payload.expression) || "").trim();
    if (!expression) return { succes: false };

    const resultat = calculerEnSecurite(expression);
    if (resultat === null) {
      return { succes: true, texteRedige: MESSAGE_INVALIDE };
    }

    const resultatArrondi = Math.round(resultat * 1e10) / 1e10; // évite les artefacts flottants
    return {
      succes: true,
      resultat: resultatArrondi,
      texteRedige: expression.trim() + " = " + resultatArrondi
    };
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
