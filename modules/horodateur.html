<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Neurone — Horodateur</title></head>
<body>
<!-- Neurone "horodateur" — date/heure actuelles, formatées en français. -->
<script>
(function () {
  "use strict";

  function formaterDate(format) {
    const maintenant = new Date();
    const options = format === "court"
      ? { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }
      : { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" };

    const texte = new Intl.DateTimeFormat("fr-FR", options).format(maintenant);
    return { texte, timestamp: maintenant.getTime() };
  }

  async function traiterRequete(payload) {
    const format = (payload && payload.format === "court") ? "court" : "long";
    const { texte, timestamp } = formaterDate(format);

    return {
      succes: true,
      date_formatee: texte,
      timestamp: timestamp,
      texteRedige: texte
    };
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
