<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Source — Devises</title></head>
<body>
<!-- Source "devises" — frankfurter.app (gratuit, sans clé, taux de change réels, données BCE). -->
<script>
(function () {
  "use strict";

  const CODES = { euros:"EUR", euro:"EUR", eur:"EUR", dollars:"USD", dollar:"USD", usd:"USD",
    livres:"GBP", livre:"GBP", gbp:"GBP", yens:"JPY", yen:"JPY", jpy:"JPY",
    francs:"CHF", franc:"CHF", chf:"CHF", cad:"CAD" };

  function extraire(texte) {
    const m = texte.match(/(\d+(?:[.,]\d+)?)\s*([a-zàéè]+)\s+en\s+([a-zàéè]+)/i);
    if (!m) return null;
    const montant = parseFloat(m[1].replace(",", "."));
    const source = CODES[m[2].toLowerCase()];
    const cible = CODES[m[3].toLowerCase()];
    if (!source || !cible) return null;
    return { montant, source, cible };
  }

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    const params = extraire(texte);
    if (!params) return { succes: true, texteRedige: "Format attendu : \"100 euros en dollars\", \"50 usd en eur\"... (devises reconnues : EUR, USD, GBP, JPY, CHF, CAD)." };

    try {
      const url = "https://api.frankfurter.app/latest?amount=" + params.montant + "&from=" + params.source + "&to=" + params.cible;
      const reponse = await fetch(url);
      if (!reponse.ok) throw new Error("HTTP " + reponse.status);
      const data = await reponse.json();
      const resultat = data.rates[params.cible];
      return {
        succes: true,
        texteRedige: params.montant + " " + params.source + " = " + resultat.toFixed(2) + " " + params.cible + " (taux du " + data.date + ")"
      };
    } catch (erreur) {
      console.error("[devises]", erreur);
      return { succes: true, texteRedige: "Je n'ai pas pu récupérer les taux de change pour le moment (service injoignable)." };
    }
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;
    const requestId = donnees.requestId;
    const payload = donnees.payload || {};
    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    });
  });
})();
</script>
</body>
</html>
