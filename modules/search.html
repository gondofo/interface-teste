<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Synthèse Web - Microservice</title>

    <script>
        /* ==========================================================
            1. EXTRACTION INTELLIGENTE DES MOTS-CLÉS
            ========================================================== */
        function extractKeywords(rawQuery) {
            if (!rawQuery) return '';
            
            const stopWords = new Set([
                "le", "la", "les", "un", "une", "des", "et", "ou", "mais", "donc", 
                "or", "ni", "car", "ce", "cette", "ces", "de", "du", "des", "a", 
                "à", "en", "par", "pour", "sur", "sous", "dans", "avec", "sans", 
                "vers", "chez", "que", "qui", "quoi", "dont", "où", "comment", 
                "pourquoi", "combien", "quel", "quelle", "quels", "quelles", 
                "est", "sont", "etre", "avoir", "fait", "faire", "dis", "donne", 
                "montre", "cherche", "recherche", "trouve", "web", "internet", "info", "infos",
                "moi", "toi", "lui", "nous", "vous", "leur", "ma", "ta", "sa", "mon", "ton", "son"
            ]);

            const words = rawQuery
                .toLowerCase()
                .replace(/[.,\/\/#!$%\^&\*;:{}=\-_`~()?"']/g, " ")
                .split(/\s+/);

            const filtered = words.filter(word => word.length > 2 && !stopWords.has(word));
            if (filtered.length === 0) return rawQuery.trim();
            return filtered.join(' ');
        }

        /* ==========================================================
            2. PROTOCOLE ROUTEUR + COMMUNICATION POSTMESSAGE
            ========================================================== */
        const SEARCH_TIMEOUT_MS = 2500;

        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data || data.type !== 'MS_REQUEST') return;

            const requestId = data.requestId;
            const payload = data.payload || {};
            const rawQuery = typeof payload === 'string' ? payload : (payload.query || payload.texte || '');

            if (!rawQuery) {
                // Remplacement du blocage par un retour JSON neutre et sécurisé
                sendResponse(event.source, event.origin, requestId, true, [], getDefaultNeutralHtml("Aucun terme fourni."));
                return;
            }

            const cleanQuery = extractKeywords(rawQuery);
            setQueryInputIfReady(rawQuery);

            executeSearch(cleanQuery, function(results, htmlContent, error) {
                // Même en cas d'erreur ou de vide, on renvoie un JSON standardisé avec succès (succes: true)
                const finalHtml = (error || !results || results.length === 0) 
                    ? getDefaultNeutralHtml("Aucune information complémentaire disponible pour le moment.") 
                    : htmlContent;
                
                const finalResults = results || [];

                sendResponse(event.source, event.origin, requestId, true, finalResults, finalHtml);
            });
        });

        (function signalReady() {
            const target = window.parent !== window ? window.parent : (window.opener || null);
            if (target) {
                target.postMessage({ type: 'MS_READY' }, '*');
            }
        })();

        function sendResponse(targetWindow, sourceOrigin, requestId, succes, resultats, htmlReponse) {
            const targetOrigin = (sourceOrigin && sourceOrigin !== 'null') ? sourceOrigin : '*';
            targetWindow.postMessage({
                type: 'MS_RESPONSE',
                requestId: requestId,
                result: {
                    succes: succes,
                    erreur: null, // Nettoyage total des erreurs bloquantes
                    resultats: resultats,
                    reponse: htmlReponse
                }
            }, targetOrigin);
        }

        function getDefaultNeutralHtml(message) {
            return `<div style="line-height: 1.6; font-size: 1rem; color: inherit;">
                <p style="margin: 0;">${message}</p>
            </div>`;
        }

        function stripHtml(str) {
            return (str || '').replace(/<[^>]*>/g, '');
        }

        function fetchWikipediaOpenSearch(query, signal) {
            const url = `https://fr.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=4&namespace=0&format=json&origin=*`;
            return fetch(url, { signal }).then(function(response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            }).then(function(data) {
                const titles = data[1] || [];
                const snippets = data[2] || [];
                const urls = data[3] || [];
                const results = [];
                for (let i = 0; i < titles.length; i++) {
                    results.push({
                        title: titles[i],
                        snippet: snippets[i] || '',
                        url: urls[i]
                    });
                }
                if (results.length === 0) throw new Error('Aucun résultat');
                return results;
            });
        }

        function fetchWikipediaRest(query, signal) {
            const url = `https://fr.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(query)}&limit=4`;
            return fetch(url, { signal }).then(function(response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            }).then(function(data) {
                const pages = data.pages || [];
                const results = pages.map(function(p) {
                    return {
                        title: p.title,
                        snippet: stripHtml(p.excerpt || p.description) || '',
                        url: 'https://fr.wikipedia.org/wiki/' + encodeURIComponent(p.key)
                    };
                });
                if (results.length === 0) throw new Error('Aucun résultat');
                return results;
            });
        }

        const SEARCH_SOURCES = [fetchWikipediaOpenSearch, fetchWikipediaRest];

        function executeSearch(query, callback) {
            setStatusIfReady('Génération de la synthèse...');

            let hasResponded = false;
            const controller = new AbortController();

            const safetyTimeout = setTimeout(function() {
                if (!hasResponded) {
                    hasResponded = true;
                    controller.abort();
                    setStatusIfReady('Traitement standard appliqué.');
                    callback([], "", "Délai de recherche dépassé.");
                }
            }, SEARCH_TIMEOUT_MS);

            const races = SEARCH_SOURCES.map(function(fetchFn) {
                return fetchFn(query, controller.signal);
            });

            Promise.any(races)
                .then(function(results) {
                    if (hasResponded) return;
                    hasResponded = true;
                    clearTimeout(safetyTimeout);
                    controller.abort();

                    const htmlContent = buildSynthesisHtml(results);
                    renderResultsIfReady(results);
                    callback(results, htmlContent, null);
                })
                .catch(function(aggregateError) {
                    if (hasResponded) return;
                    hasResponded = true;
                    clearTimeout(safetyTimeout);

                    setStatusIfReady('Aucune information directe trouvée.');
                    callback([], "", "Toutes les sources ont échoué.");
                });
        }

        /* ==========================================================
            3. ASSEMBLAGE DU TEXTE EN PARAGRAPHE DE SYNTHÈSE FLUIDE
            ========================================================== */
        function buildSynthesisHtml(results) {
            if (!results || results.length === 0) return getDefaultNeutralHtml("Aucune information disponible.");

            const sentences = results
                .map(r => r.snippet.trim())
                .filter(text => text.length > 10);

            if (sentences.length === 0) {
                return getDefaultNeutralHtml("Traitement effectué sans détails additionnels.");
            }

            let paragrapheUnifie = sentences.join(" ");
            
            if (!paragrapheUnifie.endsWith('.')) {
                paragrapheUnifie += '.';
            }

            return `<div style="line-height: 1.6; font-size: 1rem; color: inherit;">
                <p style="margin: 0;">${paragrapheUnifie}</p>
            </div>`;
        }

        function setQueryInputIfReady(query) {
            const inputEl = document.getElementById('query');
            if (inputEl) inputEl.value = query;
        }

        function setStatusIfReady(text) {
            const container = document.getElementById('results');
            if (container) container.innerHTML = `<div class="status-card"><p>${text}</p></div>`;
        }

        function renderResultsIfReady(results) {
            const container = document.getElementById('results');
            if (!container) return;
            renderResults(results);
        }
    </script>

    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --accent: #8C9380;
            --accent-hover: #757C69;
            --border: #E3E0D8;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-primary); 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
        }

        h1 { 
            font-size: 1.5rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
        }

        .search-box { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 30px; 
        }

        input[type="text"] { 
            flex: 1; 
            padding: 14px 18px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            background: var(--card-bg); 
            outline: none;
        }

        input[type="text"]:focus { 
            border-color: var(--accent); 
        }

        button { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 0 24px; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        button:hover { 
            background: var(--accent-hover); 
        }

        .results { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        .synthesis-card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .status { 
            color: var(--text-secondary); 
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Synthèse d'informations</h1>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Posez une question ou entrez un sujet..." onkeypress="checkEnter(event)">
        <button onclick="performManualSearch()">Rechercher</button>
    </div>
    
    <div class="results" id="results">
        <div class="status-card">
            <p class="status">Entrez un sujet ci-dessus pour afficher la synthèse.</p>
        </div>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === 'Enter') performManualSearch();
        }

        function performManualSearch() {
            const rawQuery = document.getElementById('query').value.trim();
            if (!rawQuery) return;
            
            const cleanQuery = extractKeywords(rawQuery);
            executeSearch(cleanQuery, function() {});
        }

        function renderResults(results) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (!results || results.length === 0) {
                container.innerHTML = '<div class="status-card"><p class="status">Traitement standard appliqué.</p></div>';
                return;
            }

            const synthesizedText = results
                .map(r => r.snippet.trim())
                .filter(text => text.length > 10)
                .join(" ");

            if (!synthesizedText) {
                container.innerHTML = '<div class="status-card"><p class="status">Synthèse standard générée.</p></div>';
                return;
            }

            container.innerHTML = `
                <div class="synthesis-card">
                    <p style="margin:0;">${synthesizedText}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
