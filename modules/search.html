<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Micro-service — Recherche web</title>
</head>
<body>
<!--
  Micro-service "web-search" — chargé en iframe invisible par l'Interface Mère.
  Protocole (voir registry.json) :
    Reçoit : window.postMessage({ type: 'MS_REQUEST', requestId, payload: { query } })
    Répond : window.postMessage({ type: 'MS_RESPONSE', requestId, result })
  où result = { succes, resultats: [{ title, url }], texteRedige }
-->
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // 1. Nettoyage défensif du sujet (au cas où le routeur transmet le
  //    prompt brut plutôt qu'un mot-clé déjà isolé)
  // ---------------------------------------------------------------------
  function extraireSujet(brut) {
    let texte = (brut || "").trim();
    if (!texte) return "";
    const declencheurs = [
      /^fais\s+une\s+recherche\s+sur\s+/i,
      /^fait\s+une\s+recherche\s+sur\s+/i,
      /^lance\s+une\s+recherche\s+sur\s+/i,
      /^effectue\s+une\s+recherche\s+sur\s+/i,
      /^recherche\s+sur\s+/i,
      /^recherche\s+/i,
      /^cherche\s+des\s+informations?\s+sur\s+/i,
      /^cherche\s+sur\s+/i,
      /^cherche\s+/i,
      /^trouve\s+(des\s+informations?\s+)?sur\s+/i,
      /^peux[- ]tu\s+chercher\s+(des\s+informations?\s+)?sur\s+/i,
      /^peux[- ]tu\s+faire\s+une\s+recherche\s+sur\s+/i,
      /^dis[- ]moi\s+en\s+plus\s+sur\s+/i,
      /^parle[- ]moi\s+de\s+/i,
      /^explique[- ]moi\s+/i,
      /^donne[- ]moi\s+des\s+informations?\s+sur\s+/i,
      /^montre[- ]moi\s+/i,
      /^j[’']aimerais\s+en\s+savoir\s+plus\s+sur\s+/i,
      /^informations?\s+sur\s+/i,
      /^qu['’]est[- ]ce\s+que\s+/i,
      /^qui\s+est\s+/i,
      /^où\s+est\s+/i,
      /^qu['’]en\s+est[- ]il\s+de\s+/i
    ];
    for (const motif of declencheurs) {
      if (motif.test(texte)) { texte = texte.replace(motif, ""); break; }
    }
    texte = texte.replace(/[?.!]+$/g, "").trim();
    return texte || (brut || "").trim();
  }

  // ---------------------------------------------------------------------
  // 2. Récupération : API Wikipédia (gratuite, CORS ouvert, sans clé)
  // ---------------------------------------------------------------------
  async function rechercherWikipedia(sujet) {
    const rechercheUrl =
      "https://fr.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=3&srsearch=" +
      encodeURIComponent(sujet);

    const rechercheReponse = await fetch(rechercheUrl);
    if (!rechercheReponse.ok) return [];
    const rechercheData = await rechercheReponse.json();
    const resultats = (rechercheData && rechercheData.query && rechercheData.query.search) || [];
    if (resultats.length === 0) return [];

    const titres = resultats.slice(0, 3).map(function (r) { return r.title; });

    const extraitUrl =
      "https://fr.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&format=json&origin=*&titles=" +
      encodeURIComponent(titres.join("|"));

    const extraitReponse = await fetch(extraitUrl);
    if (!extraitReponse.ok) return [];
    const extraitData = await extraitReponse.json();
    const pages = (extraitData && extraitData.query && extraitData.query.pages) || {};

    return Object.values(pages)
      .filter(function (p) { return p && p.extract && p.extract.trim().length > 30; })
      .map(function (p) {
        return {
          title: p.title,
          url: "https://fr.wikipedia.org/wiki/" + encodeURIComponent(p.title.replace(/ /g, "_")),
          texte: nettoyerTexte(p.extract)
        };
      });
  }

  function nettoyerTexte(brut) {
    return (brut || "")
      .replace(/\s+/g, " ")
      .replace(/\(\s*écouter\s*\)/gi, "")
      .trim()
      .slice(0, 900);
  }

  // ---------------------------------------------------------------------
  // 3. Mise en forme aérée du texte (paragraphes propres, sans rédaction
  //    par LLM ici : simple assemblage lisible des extraits récupérés)
  // ---------------------------------------------------------------------
  function formaterTexte(extraits) {
    return extraits.map(function (e) { return e.texte; }).join("\n\n");
  }

  // ---------------------------------------------------------------------
  // 4. Traitement d'une requête — retourne toujours un objet valide,
  //    jamais d'exception, jamais de champ technique brut.
  // ---------------------------------------------------------------------
  async function traiterRequete(query) {
    const sujet = extraireSujet(query);

    if (!sujet) {
      return { succes: false };
    }

    try {
      const extraits = await rechercherWikipedia(sujet);
      if (extraits.length === 0) {
        return { succes: false };
      }
      return {
        succes: true,
        resultats: extraits.map(function (e) { return { title: e.title, url: e.url }; }),
        texteRedige: formaterTexte(extraits)
      };
    } catch (erreur) {
      console.error("[search.html]", erreur);
      return { succes: false };
    }
  }

  // ---------------------------------------------------------------------
  // 5. Protocole MS_REQUEST / MS_RESPONSE (voir registry.json)
  // ---------------------------------------------------------------------
  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;

    const requestId = donnees.requestId;
    const query = donnees.payload && donnees.payload.query;

    traiterRequete(query).then(function (result) {
      window.parent.postMessage({
        type: "MS_RESPONSE",
        requestId: requestId,
        result: result
      }, "*");
    });
  });
})();
</script>
</body>
</html>
