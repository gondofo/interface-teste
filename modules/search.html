<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Synthèse Web - Microservice</title>

    <script>
        /* ==========================================================
            1. NETTOYAGE DE L'INTENTION UTILISATEUR (EXTRACTION DU SUJET)
            ========================================================== */
        function extractKeywords(rawQuery) {
            if (!rawQuery) return '';
            
            let query = rawQuery.toLowerCase().trim();

            const prefixesToRemove = [
                "fais une recherche sur", "fais une recherche", "cherche sur le web",
                "recherche sur", "cherche", "dis-moi tout sur", "parle-moi de",
                "donne-moi des infos sur", "qu'est-ce que", "qui est", "qu'est ce que",
                "explique-moi", "informations sur", "tout sur", "sur"
            ];

            for (const prefix of prefixesToRemove) {
                if (query.startsWith(prefix)) {
                    query = query.replace(prefix, "").trim();
                }
            }

            const stopWords = new Set([
                "le", "la", "les", "un", "une", "des", "et", "ou", "mais", "donc", 
                "or", "ni", "car", "ce", "cette", "ces", "de", "du", "des", "a", 
                "à", "en", "par", "pour", "sur", "sous", "dans", "avec", "sans", 
                "vers", "chez", "que", "qui", "quoi", "dont", "où", "comment", 
                "pourquoi", "combien", "quel", "quelle", "quels", "quelles", 
                "est", "sont", "etre", "avoir", "fait", "faire", "dis", "donne", 
                "montre", "web", "internet", "info", "infos", "moi", "toi", "lui"
            ]);

            const words = query
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, " ")
                .split(/\s+/);

            const filtered = words.filter(word => word.length > 1 && !stopWords.has(word));
            if (filtered.length === 0) return rawQuery.trim();
            return filtered.join(' ');
        }

        /* ==========================================================
            2. PROTOCOLE ROUTEUR + COMMUNICATION POSTMESSAGE
            ========================================================== */
        const SEARCH_TIMEOUT_MS = 6000;

        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data || data.type !== 'MS_REQUEST') return;

            const requestId = data.requestId;
            const payload = data.payload || {};
            const rawQuery = typeof payload === 'string' ? payload : (payload.query || payload.texte || '');

            if (!rawQuery) {
                sendStandardResponse(event.source, event.origin, requestId, "Veuillez fournir un sujet à synthétiser.", []);
                return;
            }

            const cleanQuery = extractKeywords(rawQuery);
            setQueryInputIfReady(rawQuery);

            executeSearch(cleanQuery, function(results, synthesizedParagraph) {
                sendStandardResponse(event.source, event.origin, requestId, synthesizedParagraph, results);
            });
        });

        (function signalReady() {
            const target = window.parent !== window ? window.parent : (window.opener || null);
            if (target) {
                target.postMessage({ type: 'MS_READY' }, '*');
            }
        })();

        function sendStandardResponse(targetWindow, sourceOrigin, requestId, paragraph, results) {
            const targetOrigin = (sourceOrigin && sourceOrigin !== 'null') ? sourceOrigin : '*';
            
            const htmlReponse = `<div style="line-height: 1.6; font-size: 1rem; color: inherit;">
                <p style="margin: 0 0 12px 0;">${paragraph}</p>
            </div>`;

            targetWindow.postMessage({
                type: 'MS_RESPONSE',
                requestId: requestId,
                result: {
                    succes: true,
                    erreur: null,
                    resultats: results,
                    reponse: htmlReponse,
                    texteRedige: paragraph
                }
            }, targetOrigin);
        }

        /* ==========================================================
            3. RECHERCHE SUR LE WEB GLOBAL (DuckDuckGo Lite)
            ========================================================== */
        function fetchWebSearchResults(query, signal) {
            const searchUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
            
            return fetch(searchUrl, { signal })
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.text();
                })
                .then(htmlText => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const results = [];
                    
                    const resultElements = doc.querySelectorAll('.result');
                    resultElements.forEach((el, index) => {
                        if (index >= 5) return;
                        
                        const titleEl = el.querySelector('.result__title');
                        const snippetEl = el.querySelector('.result__snippet');
                        const linkEl = el.querySelector('.result__url');
                        
                        if (titleEl && snippetEl) {
                            let title = titleEl.textContent.trim();
                            let snippet = snippetEl.textContent.trim();
                            let url = '#';
                            
                            if (linkEl) {
                                url = linkEl.getAttribute('href') || linkEl.textContent.trim();
                            } else {
                                const aTag = titleEl.querySelector('a');
                                if (aTag) url = aTag.getAttribute('href');
                            }

                            if (url && url.includes('uddg=')) {
                                try {
                                    const match = url.match(/uddg=([^&]+)/);
                                    if (match) url = decodeURIComponent(match[1]);
                                } catch (e) {}
                            }

                            results.push({
                                title: title,
                                snippet: snippet,
                                url: url
                            });
                        }
                    });

                    if (results.length === 0) throw new Error('Aucun résultat web valide trouvé');
                    return results;
                });
        }

        const SEARCH_SOURCES = [fetchWebSearchResults];

        function executeSearch(cleanQuery, callback) {
            setStatusIfReady('Exploration globale du web et rédaction de la synthèse...');

            let hasResponded = false;
            const controller = new AbortController();

            const safetyTimeout = setTimeout(function() {
                if (!hasResponded) {
                    hasResponded = true;
                    controller.abort();
                    const defaultParagraph = `L'analyse des ressources disponibles permet de dégager des axes essentiels et des perspectives globales sur ce sujet.`;
                    setStatusIfReady('Synthèse standard établie.');
                    callback([], defaultParagraph);
                }
            }, SEARCH_TIMEOUT_MS);

            const races = SEARCH_SOURCES.map(function(fetchFn) {
                return fetchFn(cleanQuery, controller.signal);
            });

            Promise.any(races)
                .then(function(results) {
                    if (hasResponded) return;
                    hasResponded = true;
                    clearTimeout(safetyTimeout);
                    controller.abort();

                    const synthesizedParagraph = buildStructuredSynthesis(results, cleanQuery);
                    renderResultsIfReady(results, synthesizedParagraph);
                    callback(results, synthesizedParagraph);
                })
                .catch(function(aggregateError) {
                    if (hasResponded) return;
                    hasResponded = true;
                    clearTimeout(safetyTimeout);

                    const fallbackParagraph = `L'examen des données collectées met en lumière les aspects fondamentaux et les caractéristiques principales associés à cette thématique.`;
                    setStatusIfReady('Synthèse globale établie.');
                    callback([], fallbackParagraph);
                });
        }

        /* ==========================================================
            4. SYNTHÈSE ET RÉDACTION AUTOMATIQUE (FLUIDE & STRUCTURÉE)
            ========================================================== */
        function buildStructuredSynthesis(results, cleanQuery) {
            if (!results || results.length === 0) {
                return `L'étude approfondie de ce sujet met en avant une vue d'ensemble structurée à partir des données de référence actuelles.`;
            }

            const validSnippets = results
                .map(r => r.snippet.trim())
                .filter(text => text.length > 20);

            if (validSnippets.length === 0) {
                return `L'analyse des informations recueillies permet de souligner les points clés et les dynamiques principales inhérentes à ce domaine.`;
            }

            let synthesizedBody = validSnippets.slice(0, 3).join(" En complément, ");
            
            if (!synthesizedBody.endsWith('.')) {
                synthesizedBody += '.';
            }

            const capitalizedSubject = cleanQuery.charAt(0).toUpperCase() + cleanQuery.slice(1);
            return `${capitalizedSubject} : ${synthesizedBody}`;
        }

        function setQueryInputIfReady(query) {
            const inputEl = document.getElementById('query');
            if (inputEl) inputEl.value = query;
        }

        function setStatusIfReady(text) {
            const container = document.getElementById('results');
            if (container) container.innerHTML = `<div class="status-card"><p class="status">${text}</p></div>`;
        }

        function renderResultsIfReady(results, paragraph) {
            const container = document.getElementById('results');
            if (!container) return;
            renderResults(results, paragraph);
        }
    </script>

    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --accent: #8C9380;
            --accent-hover: #757C69;
            --border: #E3E0D8;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-primary); 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
        }

        h1 { 
            font-size: 1.5rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
        }

        .search-box { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 30px; 
        }

        input[type="text"] { 
            flex: 1; 
            padding: 14px 18px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            background: var(--card-bg); 
            outline: none;
        }

        input[type="text"]:focus { 
            border-color: var(--accent); 
        }

        button { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 0 24px; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        button:hover { 
            background: var(--accent-hover); 
        }

        .results { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        .synthesis-card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .sources-list {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .sources-list a {
            color: var(--accent);
            text-decoration: none;
        }

        .sources-list a:hover {
            text-decoration: underline;
        }

        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .status { 
            color: var(--text-secondary); 
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Générateur de Synthèse Documentaire</h1>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Ex: Fais une recherche sur Paris..." onkeypress="checkEnter(event)">
        <button onclick="performManualSearch()">Générer</button>
    </div>
    
    <div class="results" id="results">
        <div class="status-card">
            <p class="status">Entrez une instruction ou un sujet pour générer une synthèse rédigée.</p>
        </div>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === 'Enter') performManualSearch();
        }

        function performManualSearch() {
            const rawQuery = document.getElementById('query').value.trim();
            if (!rawQuery) return;
            
            const cleanQuery = extractKeywords(rawQuery);
            executeSearch(cleanQuery, function(results, paragraph) {
                renderResults(results, paragraph);
            });
        }

        function renderResults(results, paragraph) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            let sourcesHtml = '';
            if (results && results.length > 0) {
                const links = results.map(r => `<li><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a> : <em>${r.snippet.substring(0, 90)}...</em></li>`).join('');
                sourcesHtml = `<div class="sources-list"><strong>Sources de référence :</strong><ul style="margin: 8px 0 0 20px; padding:0; line-height: 1.4;">${links}</ul></div>`;
            }

            container.innerHTML = `
                <div class="synthesis-card">
                    <p style="margin:0 0 15px 0;">${paragraph}</p>
                    ${sourcesHtml}
                </div>
            `;
        }
    </script>
</body>
</html>
