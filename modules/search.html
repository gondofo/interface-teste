<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module de recherche</title>
<style>
  :root {
    --ink: #1c1b1a;
    --ink-soft: #55524d;
    --paper: #fbfaf8;
    --line: #e6e2db;
    --accent: #2f5d50;
    --accent-soft: #ecf1ef;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Iowan Old Style", "Palatino Linotype", "Georgia", serif;
    color: var(--ink);
  }

  #recherche-module {
    max-width: 640px;
    margin: 0 auto;
    padding: 0;
  }

  .rm-bar {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .rm-input {
    flex: 1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease;
  }
  .rm-input:focus { border-color: var(--accent); }

  .rm-button {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .01em;
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fbfaf8;
    cursor: pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  .rm-button:hover { opacity: .92; }
  .rm-button:active { transform: scale(0.98); }
  .rm-button:disabled { opacity: .55; cursor: default; }

  .rm-output {
    margin-top: 22px;
    min-height: 0;
  }

  .rm-loading {
    display: none;
    align-items: center;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 4px 2px;
  }
  .rm-loading.active { display: flex; }

  .rm-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: rm-pulse 1.1s ease-in-out infinite;
  }
  .rm-dot:nth-child(2) { animation-delay: .15s; }
  .rm-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes rm-pulse {
    0%, 80%, 100% { opacity: .25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  .rm-article {
    display: none;
    font-size: 17px;
    line-height: 1.68;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .rm-article.active { display: block; }

  .rm-sources {
    display: none;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .rm-sources.active { display: block; }

  .rm-sources-label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .rm-source-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .rm-source-link {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    opacity: .85;
    word-break: break-word;
  }
  .rm-source-link:hover { opacity: 1; text-decoration: underline; }

  .rm-empty {
    display: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 4px 2px;
  }
  .rm-empty.active { display: block; }
</style>
</head>
<body>

<div id="recherche-module">
  <div class="rm-bar">
    <input
      type="text"
      class="rm-input"
      id="rm-input"
      placeholder="Fais une recherche sur…"
      autocomplete="off"
    />
    <button class="rm-button" id="rm-button">Rechercher</button>
  </div>

  <div class="rm-output">
    <div class="rm-loading" id="rm-loading">
      <span class="rm-dot"></span><span class="rm-dot"></span><span class="rm-dot"></span>
      <span>Recherche en cours…</span>
    </div>

    <div class="rm-empty" id="rm-empty">Aucun résultat à afficher pour l'instant.</div>

    <div class="rm-article" id="rm-article"></div>

    <div class="rm-sources" id="rm-sources">
      <div class="rm-sources-label">Sources</div>
      <div class="rm-source-list" id="rm-source-list"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Références DOM
  // ---------------------------------------------------------------------
  const input       = document.getElementById("rm-input");
  const button       = document.getElementById("rm-button");
  const loadingEl     = document.getElementById("rm-loading");
  const emptyEl       = document.getElementById("rm-empty");
  const articleEl     = document.getElementById("rm-article");
  const sourcesEl     = document.getElementById("rm-sources");
  const sourceListEl  = document.getElementById("rm-source-list");

  // ---------------------------------------------------------------------
  // 1. Nettoyage du prompt : on ne garde que le sujet clé
  // ---------------------------------------------------------------------
  function extraireSujet(brut) {
    let texte = (brut || "").trim();
    if (!texte) return "";

    const declencheurs = [
      /^fais\s+une\s+recherche\s+sur\s+/i,
      /^fait\s+une\s+recherche\s+sur\s+/i,
      /^lance\s+une\s+recherche\s+sur\s+/i,
      /^effectue\s+une\s+recherche\s+sur\s+/i,
      /^recherche\s+sur\s+/i,
      /^recherche\s+/i,
      /^cherche\s+des\s+informations?\s+sur\s+/i,
      /^cherche\s+sur\s+/i,
      /^cherche\s+/i,
      /^peux[- ]tu\s+chercher\s+(des\s+informations?\s+)?sur\s+/i,
      /^peux[- ]tu\s+faire\s+une\s+recherche\s+sur\s+/i,
      /^dis[- ]moi\s+en\s+plus\s+sur\s+/i,
      /^parle[- ]moi\s+de\s+/i,
      /^explique[- ]moi\s+/i,
      /^donne[- ]moi\s+des\s+informations?\s+sur\s+/i,
      /^j[’']aimerais\s+en\s+savoir\s+plus\s+sur\s+/i,
      /^informations?\s+sur\s+/i,
      /^qu['’]est[- ]ce\s+que\s+/i,
      /^qui\s+est\s+/i,
      /^qu['’]en\s+est[- ]il\s+de\s+/i
    ];

    for (const motif of declencheurs) {
      if (motif.test(texte)) {
        texte = texte.replace(motif, "");
        break;
      }
    }

    texte = texte.replace(/[?.!]+$/g, "").trim();
    return texte || (brut || "").trim();
  }

  // ---------------------------------------------------------------------
  // 2. Appel au modèle de rédaction intégré (recherche + rédaction)
  // ---------------------------------------------------------------------
  const SYSTEM_PROMPT = `Tu es un module de recherche et de rédaction intégré à une interface applicative. Tu ne t'adresses jamais directement à un utilisateur final : ta seule sortie doit être un objet JSON strict, destiné à être consommé par un programme.

Consignes :
1. Utilise l'outil de recherche web pour rassembler des informations fiables et à jour sur le sujet fourni.
2. Si une page ne peut pas être lue directement ou ne renvoie aucun contenu exploitable, base-toi automatiquement sur les extraits (snippets) fournis par les résultats de recherche, sans jamais signaler ce basculement ni produire un quelconque message technique à ce sujet.
3. Rédige un texte fluide, naturel et informatif en français, comme le ferait un rédacteur humain compétent. Interdiction stricte d'utiliser des formulations robotiques ou génériques telles que "l'examen des données collectées...", "les résultats de la recherche indiquent que...", "suite à une analyse...", ou toute variante de ce type. Le texte doit se lire comme un article ou une note bien écrite, avec une structure claire (2 à 4 paragraphes selon le sujet), sans puces ni titres.
4. N'inclus jamais de JSON brut, de balises techniques, de code, de messages d'erreur, ou des mentions comme "erreur", "aucun contenu textuel exploitable", "null", etc. dans le texte rédigé. Si les informations trouvées sont limitées, rédige tout de même un texte honnête et naturel qui présente ce qui est connu du sujet, sans jamais formuler cela comme un échec technique.
5. Réponds UNIQUEMENT avec un objet JSON valide, sans aucun texte avant ou après, sans balises markdown ni triple backticks, au format exact suivant :
{"article": "texte rédigé ici", "sources": [{"titre": "titre court de la source", "url": "https://..."}]}
Le tableau "sources" doit contenir uniquement des sources réellement utilisées, avec des URL valides. Si aucune source fiable n'a été trouvée, renvoie un tableau vide.`;

  async function interrogerModele(sujet) {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        system: SYSTEM_PROMPT,
        messages: [
          { role: "user", content: `Sujet à rechercher et rédiger : ${sujet}` }
        ],
        tools: [
          { type: "web_search_20250305", name: "web_search" }
        ]
      })
    });

    if (!response.ok) {
      throw new Error("network_error");
    }

    const data = await response.json();

    const texteBrut = (data.content || [])
      .filter(function (bloc) { return bloc.type === "text"; })
      .map(function (bloc) { return bloc.text; })
      .join("\n")
      .trim();

    if (!texteBrut) {
      throw new Error("empty_response");
    }

    return texteBrut;
  }

  // ---------------------------------------------------------------------
  // 3. Extraction sûre du JSON, quelle que soit l'enrobage du modèle
  // ---------------------------------------------------------------------
  function extraireJSON(texte) {
    let nettoye = texte.trim();

    nettoye = nettoye.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();

    try {
      return JSON.parse(nettoye);
    } catch (e) {
      const debut = nettoye.indexOf("{");
      const fin = nettoye.lastIndexOf("}");
      if (debut !== -1 && fin !== -1 && fin > debut) {
        const fragment = nettoye.slice(debut, fin + 1);
        try {
          return JSON.parse(fragment);
        } catch (e2) {
          return null;
        }
      }
      return null;
    }
  }

  // ---------------------------------------------------------------------
  // 4. Rendu : uniquement du texte fluide + liens de sources discrets
  // ---------------------------------------------------------------------
  function afficherResultat(objet) {
    const article = (objet && typeof objet.article === "string") ? objet.article.trim() : "";
    const sources = (objet && Array.isArray(objet.sources)) ? objet.sources : [];

    if (!article) {
      afficherEtatVide();
      return;
    }

    articleEl.textContent = article;
    articleEl.classList.add("active");

    sourceListEl.innerHTML = "";
    const sourcesValides = sources.filter(function (s) {
      return s && typeof s.url === "string" && /^https?:\/\//i.test(s.url);
    });

    if (sourcesValides.length > 0) {
      sourcesValides.forEach(function (s) {
        const lien = document.createElement("a");
        lien.className = "rm-source-link";
        lien.href = s.url;
        lien.target = "_blank";
        lien.rel = "noopener noreferrer";
        lien.textContent = (s.titre && s.titre.trim()) ? s.titre.trim() : s.url;
        sourceListEl.appendChild(lien);
      });
      sourcesEl.classList.add("active");
    } else {
      sourcesEl.classList.remove("active");
    }

    emptyEl.classList.remove("active");
  }

  function afficherEtatVide() {
    articleEl.classList.remove("active");
    sourcesEl.classList.remove("active");
    emptyEl.classList.add("active");
  }

  function reinitialiserAffichage() {
    articleEl.classList.remove("active");
    articleEl.textContent = "";
    sourcesEl.classList.remove("active");
    sourceListEl.innerHTML = "";
    emptyEl.classList.remove("active");
  }

  // ---------------------------------------------------------------------
  // 5. Orchestration principale
  // ---------------------------------------------------------------------
  async function lancerRecherche() {
    const promptBrut = input.value;
    const sujet = extraireSujet(promptBrut);

    if (!sujet) {
      afficherEtatVide();
      return;
    }

    reinitialiserAffichage();
    loadingEl.classList.add("active");
    button.disabled = true;

    try {
      const texteModele = await interrogerModele(sujet);
      const objet = extraireJSON(texteModele);
      afficherResultat(objet);
    } catch (erreur) {
      // Aucune trace technique n'est jamais exposée à l'interface.
      afficherEtatVide();
    } finally {
      loadingEl.classList.remove("active");
      button.disabled = false;
    }
  }

  button.addEventListener("click", lancerRecherche);
  input.addEventListener("keydown", function (evenement) {
    if (evenement.key === "Enter") {
      evenement.preventDefault();
      lancerRecherche();
    }
  });

  // API exposée pour l'interface mère, si elle souhaite piloter le module
  // par programmation plutôt que via les champs visibles.
  window.RechercheModule = {
    lancer: function (prompt) {
      input.value = prompt;
      return lancerRecherche();
    }
  };
})();
</script>

</body>
</html>
