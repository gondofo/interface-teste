<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recherche Web - Microservice</title>

    <script>
        /* ==========================================================
           1. EXTRACTION INTELLIGENTE DES MOTS-CLÉS DE LA REQUÊTE
           Supprime les mots vides (stop words) pour ne garder que le sujet.
           ========================================================== */
        function extractKeywords(rawQuery) {
            if (!rawQuery) return '';
            
            // Liste des mots vides en français à ignorer
            const stopWords = new Set([
                "le", "la", "les", "un", "une", "des", "et", "ou", "mais", "donc", 
                "or", "ni", "car", "ce", "cette", "ces", "de", "du", "des", "a", 
                "à", "en", "par", "pour", "sur", "sous", "dans", "avec", "sans", 
                "vers", "chez", "que", "qui", "quoi", "dont", "où", "comment", 
                "pourquoi", "combien", "quel", "quelle", "quels", "quelles", 
                "est", "sont", "etre", "avoir", "fait", "faire", "dis", "donne", 
                "montre", "cherche", "recherche", "trouve", "web", "internet", "info", "infos"
            ]);

            // Nettoyage, passage en minuscules et découpage en mots
            const words = rawQuery
                .toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, " ")
                .split(/\s+/);

            // Filtrage des mots significatifs
            const filtered = words.filter(word => word.length > 2 && !stopWords.has(word));

            // Si le filtre est trop agressif (ex: recherche courte), on renvoie la requête brute
            if (filtered.length === 0) {
                return rawQuery.trim();
            }

            return filtered.join(' ');
        }

        /* ==========================================================
           2. PROTOCOLE ROUTEUR + MOTEUR DE RECHERCHE
           ========================================================== */
        const SEARCH_TIMEOUT_MS = 2500;

        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data || data.type !== 'MS_REQUEST') return;

            const requestId = data.requestId;
            const payload = data.payload || {};
            const rawQuery = typeof payload === 'string' ? payload : (payload.query || payload.texte || '');

            if (!rawQuery) {
                sendResponse(event.source, event.origin, requestId, false, "Aucun terme fourni.", []);
                return;
            }

            // Application du filtre intelligent
            const cleanQuery = extractKeywords(rawQuery);

            setQueryInputIfReady(rawQuery); // Affiche la phrase originale dans l'input

            executeSearch(cleanQuery, function(results, error) {
                if (error) {
                    sendResponse(event.source, event.origin, requestId, false, error, []);
                } else {
                    sendResponse(event.source, event.origin, requestId, true, null, results);
                }
            });
        });

        (function signalReady() {
            const target = window.parent !== window ? window.parent : (window.opener || null);
            if (target) {
                target.postMessage({ type: 'MS_READY' }, '*');
            }
        })();

        function sendResponse(targetWindow, sourceOrigin, requestId, succes, erreur, resultats) {
            const targetOrigin = (sourceOrigin && sourceOrigin !== 'null') ? sourceOrigin : '*';
            targetWindow.postMessage({
                type: 'MS_RESPONSE',
                requestId: requestId,
                result: {
                    succes: succes,
                    erreur: erreur || null,
                    resultats: resultats
                }
            }, targetOrigin);
        }

        function stripHtml(str) {
            return (str || '').replace(/<[^>]*>/g, '');
        }

        function fetchWikipediaOpenSearch(query, signal) {
            const url = `https://fr.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=5&namespace=0&format=json&origin=*`;
            return fetch(url, { signal }).then(function(response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            }).then(function(data) {
                const titles = data[1] || [];
                const snippets = data[2] || [];
                const urls = data[3] || [];
                const results = [];
                for (let i = 0; i < titles.length; i++) {
                    results.push({
                        title: titles[i],
                        snippet: snippets[i] || 'Aucun résumé disponible pour cet article.',
                        url: urls[i]
                    });
                }
                if (results.length === 0) throw new Error('Aucun résultat');
                return results;
            });
        }

        function fetchWikipediaRest(query, signal) {
            const url = `https://fr.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(query)}&limit=5`;
            return fetch(url, { signal }).then(function(response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            }).then(function(data) {
                const pages = data.pages || [];
                const results = pages.map(function(p) {
                    return {
                        title: p.title,
                        snippet: stripHtml(p.excerpt || p.description) || 'Aucun résumé disponible.',
                        url: 'https://fr.wikipedia.org/wiki/' + encodeURIComponent(p.key)
                    };
                });
                if (results.length === 0) throw new Error('Aucun résultat');
                return results;
            });
        }

        const SEARCH_SOURCES = [fetchWikipediaOpenSearch, fetchWikipediaRest];

        function executeSearch(query, callback) {
            setStatusIfReady('Recherche en cours...');

            let hasResponded = false;
            const controller = new AbortController();

            const safetyTimeout = setTimeout(function() {
                if (!hasResponded) {
                    hasResponded = true;
                    controller.abort();
                    setStatusIfReady('La recherche prend trop de temps.');
                    callback(null, "Délai de recherche dépassé.");
                }
            }, SEARCH_TIMEOUT_MS);

            const races = SEARCH_SOURCES.map(function(fetchFn) {
                return fetchFn(query, controller.signal);
            });

            Promise.any(races)
                .then(function(results) {
                    if (hasResponded) return;
                    hasResponded = true;
                    clearTimeout(safetyTimeout);
                    controller.abort();

                    renderResultsIfReady(results);
                    callback(results, null);
                })
                .catch(function(aggregateError) {
                    if (hasResponded) return;
                    hasResponded = true;
                    clearTimeout(safetyTimeout);

                    setStatusIfReady('Aucun résultat pertinent trouvé.');
                    callback(null, "Toutes les sources ont échoué.");
                });
        }

        function setQueryInputIfReady(query) {
            const inputEl = document.getElementById('query');
            if (inputEl) inputEl.value = query;
        }

        function setStatusIfReady(text) {
            const container = document.getElementById('results');
            if (container) container.innerHTML = `<div class="status-card"><p>${text}</p></div>`;
        }

        function renderResultsIfReady(results) {
            const container = document.getElementById('results');
            if (!container) return;
            renderResults(results);
        }
    </script>

    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --accent: #8C9380;
            --accent-hover: #757C69;
            --border: #E3E0D8;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
            background: var(--bg-color); 
            color: var(--text-primary); 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
            -webkit-font-smoothing: antialiased;
        }

        h1 { 
            font-size: 1.5rem; 
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary); 
            margin-bottom: 20px; 
        }

        .search-box { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 30px; 
        }

        input[type="text"] { 
            flex: 1; 
            padding: 14px 18px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            background: var(--card-bg); 
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(140, 147, 128, 0.15);
        }

        button { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 0 24px; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: background 0.2s ease;
        }

        button:hover { 
            background: var(--accent-hover); 
        }

        .results { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        .result-card { 
            background: var(--card-bg); 
            padding: 22px; 
            border-radius: 12px; 
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
        }

        .result-card h3 { 
            margin: 0 0 8px 0; 
            font-size: 1.15rem; 
            font-weight: 600;
        }

        .result-card a { 
            color: var(--text-primary); 
            text-decoration: none; 
            transition: color 0.15s ease;
        }

        .result-card a:hover { 
            color: var(--accent-hover); 
            text-decoration: underline; 
        }

        .result-card p { 
            margin: 0; 
            color: var(--text-secondary); 
            font-size: 0.95rem; 
            line-height: 1.5; 
        }

        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .status { 
            color: var(--text-secondary); 
            font-style: normal; 
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Recherche d'informations</h1>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Entrez votre sujet ou posez une question..." onkeypress="checkEnter(event)">
        <button onclick="performManualSearch()">Rechercher</button>
    </div>
    
    <div class="results" id="results">
        <div class="status-card">
            <p class="status">Entrez un terme ci-dessus pour lancer la recherche.</p>
        </div>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === 'Enter') performManualSearch();
        }

        function performManualSearch() {
            const rawQuery = document.getElementById('query').value.trim();
            if (!rawQuery) return;
            
            const cleanQuery = extractKeywords(rawQuery);
            executeSearch(cleanQuery, function() {});
        }

        function renderResults(results) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (!results || results.length === 0) {
                container.innerHTML = '<div class="status-card"><p class="status">Aucun résultat trouvé.</p></div>';
                return;
            }

            results.forEach(r => {
                container.innerHTML += `
                    <div class="result-card">
                        <h3><a href="${r.url}" target="_blank">${r.title}</a></h3>
                        <p>${r.snippet}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
