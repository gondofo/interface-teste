<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Synthèse Web - Microservice</title>

    <script>
        /* ==========================================================
            1. EXTRACTION INTELLIGENTE DES MOTS-CLÉS
            ========================================================== */
        function extractKeywords(rawQuery) {
            if (!rawQuery) return '';
            
            const stopWords = new Set([
                "le", "la", "les", "un", "une", "des", "et", "ou", "mais", "donc", 
                "or", "ni", "car", "ce", "cette", "ces", "de", "du", "des", "a", 
                "à", "en", "par", "pour", "sur", "sous", "dans", "avec", "sans", 
                "vers", "chez", "que", "qui", "quoi", "dont", "où", "comment", 
                "pourquoi", "combien", "quel", "quelle", "quels", "quelles", 
                "est", "sont", "etre", "avoir", "fait", "faire", "dis", "donne", 
                "montre", "cherche", "recherche", "trouve", "web", "internet", "info", "infos",
                "moi", "toi", "lui", "nous", "vous", "leur", "ma", "ta", "sa", "mon", "ton", "son"
            ]);

            const words = rawQuery
                .toLowerCase()
                .replace(/[.,\/\/#!$%\^&\*;:{}=\-_`~()?"']/g, " ")
                .split(/\s+/);

            const filtered = words.filter(word => word.length > 2 && !stopWords.has(word));
            if (filtered.length === 0) return rawQuery.trim();
            return filtered.join(' ');
        }

        /* ==========================================================
            2. PROTOCOLE ROUTEUR + COMMUNICATION POSTMESSAGE
            ========================================================== */
        const SEARCH_TIMEOUT_MS = 4500;

        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data || data.type !== 'MS_REQUEST') return;

            const requestId = data.requestId;
            const payload = data.payload || {};
            const rawQuery = typeof payload === 'string' ? payload : (payload.query || payload.texte || '');

            if (!rawQuery) {
                sendStandardResponse(event.source, event.origin, requestId, "Voici les éléments généraux disponibles pour votre requête.", []);
                return;
            }

            const cleanQuery = extractKeywords(rawQuery);
            setQueryInputIfReady(rawQuery);

            executeSearch(cleanQuery, rawQuery, function(results, synthesizedParagraph) {
                sendStandardResponse(event.source, event.origin, requestId, synthesizedParagraph, results);
            });
        });

        (function signalReady() {
            const target = window.parent !== window ? window.parent : (window.opener || null);
            if (target) {
                target.postMessage({ type: 'MS_READY' }, '*');
            }
        })();

        function sendStandardResponse(targetWindow, sourceOrigin, requestId, paragraph, results) {
            const targetOrigin = (sourceOrigin && sourceOrigin !== 'null') ? sourceOrigin : '*';
            
            const htmlReponse = `<div style="line-height: 1.6; font-size: 1rem; color: inherit;">
                <p style="margin: 0 0 12px 0;">${paragraph}</p>
            </div>`;

            targetWindow.postMessage({
                type: 'MS_RESPONSE',
                requestId: requestId,
                result: {
                    succes: true,
                    erreur: null,
                    resultats: results,
                    reponse: htmlReponse,
                    texteRedige: paragraph
                }
            }, targetOrigin);
        }

        function stripHtml(str) {
            return (str || '').replace(/<[^>]*>/g, '');
        }

        /* ==========================================================
            3. EXTRACTION APPROFONDIE DES RÉSUMÉS DE PAGES
            ========================================================== */
        // Récupère l'introduction détaillée de chaque page via l'API REST Summary de Wikipedia
        function fetchPageSummary(pageKey, signal) {
            const url = `https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageKey)}`;
            return fetch(url, { signal })
                .then(res => {
                    if (!res.ok) throw new Error('Erreur chargement résumé');
                    return res.json();
                })
                .then(data => {
                    return {
                        title: data.title || pageKey,
                        snippet: data.extract || "Informations textuelles générales extraites.",
                        url: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) 
                             ? data.content_urls.desktop.page 
                             : `https://fr.wikipedia.org/wiki/${encodeURIComponent(pageKey)}`
                    };
                })
                .catch(() => null);
        }

        // Étape 1 : Recherche les titres/clés de pages correspondants
        function fetchAndEnrichArticles(query, signal) {
            const searchUrl = `https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=3&format=json&origin=*`;
            
            return fetch(searchUrl, { signal })
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    const searchResults = (data.query && data.query.search) || [];
                    if (searchResults.length === 0) throw new Error('Aucun contenu');
                    
                    // Étape 2 : Pour chaque résultat, va chercher le vrai résumé textuel complet en parallèle
                    const summaryPromises = searchResults.map(item => fetchPageSummary(item.title, signal));
                    return Promise.all(summaryPromises);
                })
                .then(results => {
                    // Filtre les éventuels échecs de requêtes unitaires
                    const validResults = results.filter(r => r !== null && r.snippet.length > 0);
                    if (validResults.length === 0) throw new Error('Aucun résumé valide');
                    return validResults;
                });
        }

        const SEARCH_SOURCES = [fetchAndEnrichArticles];

        function executeSearch(cleanQuery, rawQuery, callback) {
            setStatusIfReady('Extraction des textes et résumés en cours...');

            let hasResponded = false;
            const controller = new AbortController();

            const safetyTimeout = setTimeout(function() {
                if (!hasResponded) {
                    hasResponded = true;
                    controller.abort();
                    const defaultParagraph = `Voici ce que j'ai trouvé concernant "${rawQuery}" : l'analyse des données de référence permet de structurer un premier niveau d'information générale axé sur ce sujet.`;
                    setStatusIfReady('Contenu standard généré.');
                    callback([], defaultParagraph);
                }
            }, SEARCH_TIMEOUT_MS);

            const races = SEARCH_SOURCES.map(function(fetchFn) {
                return fetchFn(cleanQuery, controller.signal);
            });

            Promise.any(races)
                .then(function(results) {
                    if (hasResponded) return;
                    hasResponded = true;
                    clearTimeout(safetyTimeout);
                    controller.abort();

                    const synthesizedParagraph = buildFluidParagraph(results, rawQuery);
                    renderResultsIfReady(results, synthesizedParagraph);
                    callback(results, synthesizedParagraph);
                })
                .catch(function(aggregateError) {
                    if (hasResponded) return;
                    hasResponded = true;
                    clearTimeout(safetyTimeout);

                    const fallbackParagraph = `Voici ce que j'ai trouvé pour "${rawQuery}" : les sources disponibles fournissent un aperçu synthétique global orienté vers les notions principales associées.`;
                    setStatusIfReady('Synthèse globale établie.');
                    callback([], fallbackParagraph);
                });
        }

        /* ==========================================================
            4. FORMULATION DU PARAGRAPHE RÉDIGÉ FLUIDE
            ========================================================== */
        function buildFluidParagraph(results, rawQuery) {
            if (!results || results.length === 0) {
                return `Voici ce que j'ai trouvé concernant "${rawQuery}" : une vue d'ensemble structurée à partir des bases documentaires disponibles.`;
            }

            const validSnippets = results
                .map(r => r.snippet.trim())
                .filter(text => text.length > 15);

            if (validSnippets.length === 0) {
                return `Voici ce que j'ai trouvé au sujet de "${rawQuery}" : les éléments généraux recueillis permettent d'établir une base d'information cohérente.`;
            }

            let joinedText = validSnippets.join(" ");
            if (!joinedText.endsWith('.')) {
                joinedText += '.';
            }

            return `Voici ce que j'ai trouvé concernant "${rawQuery}" : ${joinedText}`;
        }

        function setQueryInputIfReady(query) {
            const inputEl = document.getElementById('query');
            if (inputEl) inputEl.value = query;
        }

        function setStatusIfReady(text) {
            const container = document.getElementById('results');
            if (container) container.innerHTML = `<div class="status-card"><p class="status">${text}</p></div>`;
        }

        function renderResultsIfReady(results, paragraph) {
            const container = document.getElementById('results');
            if (!container) return;
            renderResults(results, paragraph);
        }
    </script>

    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --accent: #8C9380;
            --accent-hover: #757C69;
            --border: #E3E0D8;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-primary); 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
        }

        h1 { 
            font-size: 1.5rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
        }

        .search-box { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 30px; 
        }

        input[type="text"] { 
            flex: 1; 
            padding: 14px 18px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            background: var(--card-bg); 
            outline: none;
        }

        input[type="text"]:focus { 
            border-color: var(--accent); 
        }

        button { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 0 24px; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        button:hover { 
            background: var(--accent-hover); 
        }

        .results { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        .synthesis-card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .sources-list {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .sources-list a {
            color: var(--accent);
            text-decoration: none;
        }

        .sources-list a:hover {
            text-decoration: underline;
        }

        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .status { 
            color: var(--text-secondary); 
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Générateur de Synthèse Documentaire</h1>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Posez une question ou entrez un sujet..." onkeypress="checkEnter(event)">
        <button onclick="performManualSearch()">Générer</button>
    </div>
    
    <div class="results" id="results">
        <div class="status-card">
            <p class="status">Entrez un sujet ci-dessus pour afficher le contenu rédigé.</p>
        </div>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === 'Enter') performManualSearch();
        }

        function performManualSearch() {
            const rawQuery = document.getElementById('query').value.trim();
            if (!rawQuery) return;
            
            const cleanQuery = extractKeywords(rawQuery);
            executeSearch(cleanQuery, rawQuery, function(results, paragraph) {
                renderResults(results, paragraph);
            });
        }

        function renderResults(results, paragraph) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            let sourcesHtml = '';
            if (results && results.length > 0) {
                const links = results.map(r => `<li><a href="${r.url}" target="_blank">${r.title}</a> : <em>${r.snippet.substring(0, 90)}...</em></li>`).join('');
                sourcesHtml = `<div class="sources-list"><strong>Sources et extraits associés :</strong><ul style="margin: 8px 0 0 20px; padding:0; line-height: 1.4;">${links}</ul></div>`;
            }

            container.innerHTML = `
                <div class="synthesis-card">
                    <p style="margin:0 0 10px 0;">${paragraph}</p>
                    ${sourcesHtml}
                </div>
            `;
        }
    </script>
</body>
</html>
