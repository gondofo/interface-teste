<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Neurone — Conversation locale</title>
</head>
<body>
<!--
  Neurone "conversation" — discussion libre, code, raisonnement, analyse.
  Protocole MS_REQUEST / MS_RESPONSE (voir registry.json / gabarit).

  Fonctionne uniquement sur les appareils jugés capables (desktop, mémoire
  suffisante). Sur les autres, renvoie une explication honnête plutôt que
  de risquer un plantage — c'est un choix assumé, pas un oubli.
-->
<script type="module">
  const requetesEnAttente = [];

  // ---------------------------------------------------------------------
  // 1. Détection défensive de la capacité de l'appareil
  //    (appelée AVANT toute tentative de chargement du modèle)
  // ---------------------------------------------------------------------
  function appareilCapable() {
    const uaMobile = /Android|iPhone|iPad|iPod|Mobile|Tablet|Silk/i.test(navigator.userAgent);
    if (uaMobile) return false;

    // navigator.deviceMemory n'est pas disponible partout (ex: Safari) —
    // absence d'info ne bloque pas, seule une valeur basse confirmée bloque.
    if (typeof navigator.deviceMemory === "number" && navigator.deviceMemory < 4) return false;

    return true;
  }

  const MESSAGE_INDISPONIBLE =
    "La conversation libre s'appuie sur un petit modèle de langage exécuté directement " +
    "dans le navigateur. Cet appareil (mémoire ou type d'appareil détecté) n'est pas assez " +
    "puissant pour l'exécuter de façon fiable, donc cette fonctionnalité reste réservée aux " +
    "ordinateurs de bureau ou portables pour l'instant.";

  const MESSAGE_ECHEC_CHARGEMENT =
    "Le modèle de langage local n'a pas pu être chargé ou a mis trop de temps à répondre sur " +
    "cet appareil. Réessayez, ou reformulez en un message plus court.";

  // ---------------------------------------------------------------------
  // 2. Chargement paresseux du modèle, uniquement si l'appareil est capable
  // ---------------------------------------------------------------------
  let generateurPromise = null;

  async function obtenirGenerateur() {
    if (!generateurPromise) {
      generateurPromise = (async () => {
        const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0");
        env.allowLocalModels = false;
        return pipeline("text-generation", "onnx-community/Qwen2.5-0.5B-Instruct", { dtype: "q4" });
      })();
    }
    return generateurPromise;
  }

  function avecDelaiMax(promesse, ms) {
    return Promise.race([
      promesse,
      new Promise((_, reject) => setTimeout(() => reject(new Error("delai_depasse")), ms))
    ]);
  }

  // ---------------------------------------------------------------------
  // 3. Traitement d'une requête — toujours un objet propre, jamais
  //    d'exception qui s'échappe, jamais de plantage même en cas d'échec.
  // ---------------------------------------------------------------------
  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    if (!texte) return { succes: false };

    if (!appareilCapable()) {
      return { succes: true, texteRedige: MESSAGE_INDISPONIBLE };
    }

    try {
      // Le chargement du modèle n'arrive qu'une fois (téléchargement ~350 Mo
      // puis mise en cache navigateur) : on lui laisse largement le temps,
      // surtout sur un premier essai / connexion lente.
      const gen = await avecDelaiMax(obtenirGenerateur(), 120000);

      const messages = [
        {
          role: "system",
          content:
            "Tu es un assistant conversationnel concis en français. Tu aides pour la discussion " +
            "libre, le code, la logique et l'analyse. Réponds directement, sans formulations " +
            "robotiques ni préambule administratif, en 1 à 4 paragraphes ou en bloc de code si " +
            "pertinent."
        },
        { role: "user", content: texte }
      ];

      // La génération, elle, doit rester rapide une fois le modèle en mémoire.
      const sortie = await avecDelaiMax(
        gen(messages, { max_new_tokens: 350, temperature: 0.7, do_sample: true, top_p: 0.9, return_full_text: false }),
        40000
      );

      const brut = sortie?.[0]?.generated_text;
      let reponseTexte = "";
      if (typeof brut === "string") {
        reponseTexte = brut;
      } else if (Array.isArray(brut)) {
        const dernier = brut[brut.length - 1];
        reponseTexte = (dernier && typeof dernier.content === "string") ? dernier.content : "";
      }
      reponseTexte = reponseTexte.trim();

      if (!reponseTexte) {
        return { succes: true, texteRedige: MESSAGE_ECHEC_CHARGEMENT };
      }
      return { succes: true, texteRedige: reponseTexte };
    } catch (erreur) {
      console.error("[conversation.html]", erreur);
      return { succes: true, texteRedige: MESSAGE_ECHEC_CHARGEMENT };
    }
  }

  // ---------------------------------------------------------------------
  // 4. Protocole MS_REQUEST / MS_RESPONSE
  // ---------------------------------------------------------------------
  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;

    const requestId = donnees.requestId;
    const payload = donnees.payload || {};

    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    }).catch(function (erreur) {
      console.error("[conversation.html]", erreur);
      window.parent.postMessage({
        type: "MS_RESPONSE",
        requestId,
        result: { succes: true, texteRedige: MESSAGE_ECHEC_CHARGEMENT }
      }, "*");
    });
  });
</script>
</body>
</html>
