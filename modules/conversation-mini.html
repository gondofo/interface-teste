<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Neurone — Conversation (modèle miniature)</title>
</head>
<body>
<!--
  Neurone "conversation-mini" — petit modèle de langage local (135M
  paramètres, ~4x plus léger que la tentative précédente à 500M qui
  surchargeait le Chromebook). 100% local, aucun cloud.

  ATTENTION HONNÊTE : SmolLM2 est entraîné principalement en anglais.
  En français, les réponses seront souvent de moins bonne qualité,
  parfois incohérentes. C'est un vrai compromis, pas un bug.
-->
<script type="module">
  function appareilMobile() {
    return /Android|iPhone|iPad|iPod|Mobile|Tablet|Silk/i.test(navigator.userAgent);
  }

  const MESSAGE_MOBILE =
    "Ce neurone (modèle de langage local) est réservé aux ordinateurs de bureau/portables — " +
    "il n'est pas lancé sur mobile pour éviter de surcharger l'appareil.";

  const MESSAGE_ECHEC =
    "Le modèle miniature n'a pas pu répondre cette fois-ci (chargement trop long ou erreur locale). " +
    "Réessayez, ou reformulez en un message plus court.";

  let generateurPromise = null;

  async function obtenirGenerateur() {
    if (!generateurPromise) {
      generateurPromise = (async () => {
        console.log("[conversation-mini] import de la bibliothèque…");
        const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0");
        env.allowLocalModels = false;
        console.log("[conversation-mini] création du pipeline (SmolLM2-135M-Instruct, q4)…");
        const gen = await pipeline("text-generation", "HuggingFaceTB/SmolLM2-135M-Instruct", {
          dtype: "q4",
          progress_callback: (info) => {
            if (info && info.status === "progress") {
              console.log("[conversation-mini] téléchargement " + (info.file || "") + " : " + Math.round(info.progress || 0) + "%");
            } else if (info && info.status) {
              console.log("[conversation-mini] étape : " + info.status + (info.file ? " (" + info.file + ")" : ""));
            }
          }
        });
        console.log("[conversation-mini] pipeline prêt.");
        return gen;
      })();
    }
    return generateurPromise;
  }

  function avecDelaiMax(promesse, ms) {
    return Promise.race([
      promesse,
      new Promise((_, reject) => setTimeout(() => reject(new Error("delai_depasse")), ms))
    ]);
  }

  async function traiterRequete(payload) {
    const texte = ((payload && (payload.texte || payload.query)) || "").trim();
    if (!texte) return { succes: false };

    if (appareilMobile()) {
      return { succes: true, texteRedige: MESSAGE_MOBILE };
    }

    try {
      const gen = await avecDelaiMax(obtenirGenerateur(), 90000);

      const messages = [
        {
          role: "system",
          content:
            "Tu es un assistant concis. Réponds directement, en français si possible, sans " +
            "préambule ni formulation robotique, en 1 à 3 courtes phrases."
        },
        { role: "user", content: texte }
      ];

      const sortie = await avecDelaiMax(
        gen(messages, { max_new_tokens: 150, temperature: 0.6, do_sample: true, top_p: 0.9, return_full_text: false }),
        30000
      );

      const brut = sortie?.[0]?.generated_text;
      let reponseTexte = "";
      if (typeof brut === "string") {
        reponseTexte = brut;
      } else if (Array.isArray(brut)) {
        const dernier = brut[brut.length - 1];
        reponseTexte = (dernier && typeof dernier.content === "string") ? dernier.content : "";
      }
      reponseTexte = reponseTexte.trim();

      return { succes: true, texteRedige: reponseTexte || MESSAGE_ECHEC };
    } catch (erreur) {
      console.error("[conversation-mini]", erreur);
      return { succes: true, texteRedige: MESSAGE_ECHEC };
    }
  }

  window.addEventListener("message", function (evenement) {
    const donnees = evenement.data;
    if (!donnees || donnees.type !== "MS_REQUEST") return;

    const requestId = donnees.requestId;
    const payload = donnees.payload || {};

    traiterRequete(payload).then(function (result) {
      window.parent.postMessage({ type: "MS_RESPONSE", requestId, result }, "*");
    }).catch(function (erreur) {
      console.error("[conversation-mini]", erreur);
      window.parent.postMessage({
        type: "MS_RESPONSE",
        requestId,
        result: { succes: true, texteRedige: MESSAGE_ECHEC }
      }, "*");
    });
  });
</script>
</body>
</html>
